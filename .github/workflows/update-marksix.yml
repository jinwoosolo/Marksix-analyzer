name: Update Mark Six Data
on:
  schedule:
    - cron: '30 2 * * 2,4,6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ← 加呢行！
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install deps
      run: pip install requests beautifulsoup4 pandas
    
    - name: Scrape latest
      run: python scraper.py
    
    - name: Commit & push
      run: |
        git config user.name "MarkSix Bot"
        git config user.email "bot@example.com"
        git add .
        if git diff --staged --quiet; then
          echo "No changes"
        else
          git commit -m "Update Mark Six $(date +%Y-%m-%d)"
          git push
        fi
