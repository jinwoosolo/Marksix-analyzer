name: Update Mark Six Data

on:
  schedule:
    - cron: '30 2 * * 2,4,6'  # Tue/Thu/Sat 2:30AM HKT (開彩後)
  workflow_dispatch:  # 手動觸發鈕

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas
    
    - name: Scrape latest results
      run: python scraper.py
      
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "MarkSixBot"
        git add data/ *.csv
        git diff --staged --quiet || git commit -m "Update Mark Six $(date +%Y-%m-%d)"
        git push
