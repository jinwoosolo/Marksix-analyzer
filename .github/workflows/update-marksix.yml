name: Daily Mark Six Data Update

on:
  schedule:
    - cron: '30 14 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas lxml

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. 檢查 marksix.csv 是否真的有被修改
          if git diff --quiet marksix.csv; then
            echo "偵測結果：數據已是最新，無需 Commit。"
          else
            # 2. 暫存變動並 Commit
            git add marksix.csv
            git commit -m "自動更新六合彩數據: $(date +'%Y-%m-%d')"
            
            # 3. 關鍵：先拉取遠端最新代碼並執行 Rebase，解決衝突
            git fetch origin main
            git rebase origin/main
            
            # 4. 推送回 GitHub
            git push origin main
          fi
